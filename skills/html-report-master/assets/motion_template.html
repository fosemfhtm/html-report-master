<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모션 발표 틀</title>
<!-- 작업 중에는 fonts/, vendor/ 를 상대 경로로 둔다. 배포본은 scripts/build_single_file.mjs 로 한 파일로 만든다. -->
<style>
@font-face { font-family: "Pretendard"; src: url("fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }

/* ---------- 토큰: 다크(기본)와 라이트. 그림의 색은 모두 이 변수로 쓴다. 그래야 T 키 전환이 그림까지 바뀐다 ---------- */
:root {
  --font: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", "Pretendard", Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --card3: #3a3a3c;
  --fg: #fff; --fg2: rgb(235 235 245 / .74); --fg3: rgb(235 235 245 / .52); --sep: rgb(84 84 88 / .6);
  --fill: rgb(118 118 128 / .24); --fill2: rgb(118 118 128 / .16);
  /* 역할 색: 한 덱 안에서 한 역할은 늘 같은 색 */
  --c-blue: #0a84ff; --c-indigo: #6d7cff; --c-mint: #00dac3; --c-green: #30d158; --c-yellow: #ffd60a;
  --c-orange: #ff9230; --c-red: #ff453a; --c-pink: #ff375f; --c-gray: #8e8e93;
  --accent: var(--c-mint);
  --code-kw: #ff7ab2; --code-num: #d9c97c; --code-cm: #8a96a3; --code-pun: rgb(235 235 245 / .62);
  --glass: rgb(40 40 44 / .62); --shadow: 0 10px 30px rgb(0 0 0 / .35);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f2f7; --card: #fff; --card2: #e5e5ea; --card3: #d1d1d6;
  --fg: #000; --fg2: #3c3c43; --fg3: #6e6e73; --sep: rgb(60 60 67 / .29);
  --fill: rgb(118 118 128 / .14); --fill2: rgb(118 118 128 / .09);
  --c-blue: #007aff; --c-indigo: #5856d6; --c-mint: #00a693; --c-green: #24a148; --c-yellow: #c79500;
  --c-orange: #e8850c; --c-red: #e5383b; --c-pink: #e0245e; --c-gray: #8e8e93;
  --accent: var(--c-mint);
  --code-kw: #c41a7f; --code-num: #9a6b00; --code-cm: #6e6e73; --code-pun: #6e6e73;
  --glass: rgb(255 255 255 / .7); --shadow: 0 10px 30px rgb(0 0 0 / .12);
}

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; word-break: keep-all; }
[hidden] { display: none !important; }
#app { position: relative; height: 100%; }
#app.idle { cursor: none; }
#wrap { position: absolute; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
.ko, .en { display: none; }
[data-lang="ko"] .ko, [data-lang="en"] .en { display: inline; }
.scene { position: absolute; inset: 0; visibility: hidden; }
.abs { position: absolute; box-sizing: border-box; }

/* ---------- 글자 단계 (1920×1080 무대 기준). 17px 아래는 쓰지 않는다 ---------- */
.eyebrow { font: 600 20px/1.2 var(--font); letter-spacing: .04em; color: var(--fg3); }
.t-title { font: 700 48px/1.2 var(--font); letter-spacing: -.025em; text-wrap: balance; }
.t-h2 { font: 700 34px/1.25 var(--font); letter-spacing: -.02em; }
.t-h3 { font: 600 28px/1.3 var(--font); letter-spacing: -.015em; }
.t-body { font: 400 24px/1.42 var(--font); }
.t-callout { font: 400 22px/1.4 var(--font); }
.t-meta { font: 400 19px/1.4 var(--font); color: var(--fg2); }
.t-num { font-variant-numeric: tabular-nums; }
.t-big { font: 700 64px/1.1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

/* ---------- 자막: 스텝마다 1~2문장 ---------- */
#caps { position: absolute; left: 160px; right: 160px; top: 944px; height: 116px; display: flex; justify-content: center; pointer-events: none; }
.cap { position: absolute; max-width: 1600px; text-align: center; font: 500 30px/1.45 var(--font); letter-spacing: -.02em; color: var(--fg); visibility: hidden; text-wrap: balance; }

/* ---------- 면 ---------- */
.card { background: var(--card); border-radius: 20px; }
.card2 { background: var(--card2); border-radius: 14px; }
.pill { display: inline-flex; align-items: center; height: 42px; padding: 0 20px; border-radius: 999px; background: var(--fill); font: 600 21px/1 var(--font); color: var(--fg2); }
.sep { height: 1px; background: var(--sep); }

/* ---------- 코드 ---------- */
.code { font-family: var(--mono); white-space: pre; line-height: 1.55; color: var(--fg); letter-spacing: 0; }
.code .ln { display: block; min-height: 1em; }
.code .kw { color: var(--code-kw); font-weight: 600; }
.code .num { color: var(--code-num); }
.code .fn { color: var(--accent); }
.code .cm { color: var(--code-cm); font-style: italic; }
.code .pun { color: var(--code-pun); }
.code .mk { border-radius: 5px; background: color-mix(in srgb, var(--c-yellow) 18%, transparent); box-shadow: 0 0 0 2px var(--c-yellow); }

/* 식 카드: 위는 말 풀이, 아래는 코드. 코드도 읽히는 크기와 대비로 둔다 */
.formula { padding: 26px 30px; }
.formula .say { font: 600 28px/1.35 var(--font); }
.formula .code { margin-top: 12px; font-size: 20px; color: var(--fg2); white-space: pre-wrap; }

/* ---------- 상태 테두리: 강조·채택·실패 ---------- */
.ring { position: absolute; inset: -4px; border-radius: inherit; border: 3px solid transparent; pointer-events: none; }

/* ---------- 탐색 도구: 진행 캡슐, 스텝 점, 장면 목록 ---------- */
#nav { position: absolute; right: 110px; top: 40px; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--glass); box-shadow: var(--shadow); visibility: hidden; }
#nav > span { font: 600 18px/1 var(--font); padding: 10px 18px; border-radius: 999px; color: var(--fg3); }
#nav > span.on { color: #fff; background: var(--accent); }
#nav > span.done { color: var(--fg2); }
#dots { position: absolute; right: 24px; bottom: 20px; z-index: 6; display: flex; gap: 8px; pointer-events: none; }
#dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--fill); }
#dots i.on { background: var(--fg2); }
#list { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / .5); backdrop-filter: blur(8px); }
#list .box { width: min(1000px, calc(100% - 32px)); max-height: calc(100% - 64px); overflow: auto; box-sizing: border-box; padding: 22px; border-radius: 22px; background: var(--card); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
#list button { font: 600 16px/1.35 var(--font); text-align: left; color: var(--fg); background: var(--fill2); border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer; }
#list button:hover { background: var(--fill); }
#list button .n { display: block; font: 500 13px var(--mono); color: var(--fg3); margin-bottom: 4px; }
#list button.cur { outline: 2px solid var(--accent); }
#hint { position: absolute; left: 20px; bottom: 16px; z-index: 6; padding: 8px 16px; border-radius: 999px; background: var(--glass); color: var(--fg2); font: 500 14px var(--font); transition: opacity .6s; }
#hint.gone { opacity: 0; pointer-events: none; }
@media print { #dots, #hint, #list { display: none !important; } }
</style>
</head>
<body>
<div id="app" data-lang="ko">
  <div id="wrap"><div id="stage"><div id="nav"></div><div id="caps"></div></div></div>
  <div id="list" hidden><div class="box"></div></div>
  <div id="dots" aria-hidden="true"></div>
  <div id="hint"></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
/* ======================= 엔진 =======================
   장면(scene) 안에 스텝(step)을 쌓는다. 스텝 하나 = 생각 하나 = 자막 하나. 스텝이 끝나면 멈추고, Space/→ 로 다음 스텝을 재생한다.
   글은 '한국어' 또는 ['한국어', 'English'] 로 쓴다. deck.config({langs: ['ko', 'en']}) 일 때만 L 키로 언어를 바꾼다.
   보고서에 넣는 내용은 아래 "장면" 부분만 고친다. 엔진은 고치지 않는다. */
const deck = (() => {
  const app = document.getElementById('app'), stage = document.getElementById('stage');
  const capsEl = document.getElementById('caps'), navEl = document.getElementById('nav');
  const dotsEl = document.getElementById('dots'), listEl = document.getElementById('list'), hintEl = document.getElementById('hint');
  const NS = 'http://www.w3.org/2000/svg';
  const cfg = { langs: ['ko'], key: document.title };
  const tl = gsap.timeline({ paused: true });
  const scenes = [], beats = [], ambients = [];
  let T = 0;

  /* ---------- 글 ---------- */
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const tx = v => Array.isArray(v) ? (cfg.langs.length > 1 ? `<span class="ko">${v[0]}</span><span class="en">${v[1]}</span>` : v[0]) : (v ?? '');

  /* ---------- 요소 ---------- */
  function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
  function box(parent, x, y, w, h, cls, html) {
    const e = el('div', 'abs ' + (cls || ''), parent, html == null ? null : tx(html));
    Object.assign(e.style, { left: x + 'px', top: y + 'px' }); if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px';
    return e;
  }
  function svg(parent, x, y, w, h) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('width', w); s.setAttribute('height', h); Object.assign(s.style, { position: 'absolute', left: x + 'px', top: y + 'px', overflow: 'visible' }); parent.appendChild(s); return s; }
  /** SVG 요소. text 가 ['한국어', 'English'] 이면 언어별 tspan 두 개로 넣는다 */
  function sv(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) { if (k === 'style') e.style.cssText = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (Array.isArray(text)) e.innerHTML = cfg.langs.length > 1 ? `<tspan class="ko">${esc(text[0])}</tspan><tspan class="en">${esc(text[1])}</tspan>` : esc(text[0]);
    else if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e); return e;
  }

  /* 배치: 머리(섹션·제목) 아래 본문 영역. 무대(늘 같은 자리의 기준 예제)는 왼쪽, 작업대는 오른쪽 */
  const L = {
    full: { x: 110, y: 214, w: 1700, h: 700 },
    stage: { x: 110, y: 214, w: 640, h: 700 },
    bench: { x: 810, y: 214, w: 1000, h: 700 },
  };
  /** 영역을 cols×rows 칸으로 나눈다. 칸 하나는 {x, y, w, h} */
  function grid(r, cols, rows = 1, gap = 24) {
    const w = (r.w - gap * (cols - 1)) / cols, h = (r.h - gap * (rows - 1)) / rows, out = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) out.push({ x: r.x + i * (w + gap), y: r.y + j * (h + gap), w, h });
    return out;
  }

  /* ---------- 코드 강조: «…» 로 감싼 부분은 노란 표시 ---------- */
  const KW = new Set(['def', 'return', 'lambda', 'if', 'else', 'for', 'in', 'and', 'or', 'not', 'let', 'const', 'function', 'while', 'SELECT', 'FROM', 'WHERE']);
  function code(src) {
    let inMark = false; const out = [];
    for (const line of String(src).split('\n')) {
      let h = inMark ? '<span class="mk">' : '', rest = line, comment = '';
      const ci = line.indexOf('#'); if (ci >= 0) { rest = line.slice(0, ci); comment = line.slice(ci); }
      const re = /(«|»|[A-Za-z_][\w.]*|\d+(?:\.\d+)?|\s+|.)/g; let m;
      while ((m = re.exec(rest))) {
        const t = m[0];
        if (t === '«') { h += '<span class="mk">'; inMark = true; continue; }
        if (t === '»') { h += '</span>'; inMark = false; continue; }
        if (KW.has(t)) h += `<span class="kw">${t}</span>`;
        else if (/^\d/.test(t)) h += `<span class="num">${t}</span>`;
        else if (/^[A-Za-z_]/.test(t) && rest.slice(m.index + t.length).startsWith('(')) h += `<span class="fn">${esc(t)}</span>`;
        else if (/^[A-Za-z_\s]/.test(t)) h += esc(t);
        else h += `<span class="pun">${esc(t)}</span>`;
      }
      if (inMark) h += '</span>';
      if (comment) h += `<span class="cm">${esc(comment)}</span>`;
      out.push(`<span class="ln">${h || ' '}</span>`);
    }
    return out.join('');
  }
  function codeBox(parent, x, y, w, h, src, size = 22) { const e = box(parent, x, y, w, h, 'code'); e.innerHTML = code(src); e.style.fontSize = size + 'px'; return e; }
  /** 식 카드: 위 줄은 말 풀이, 아래는 코드 */
  function formula(parent, x, y, w, say, src) {
    const c = box(parent, x, y, w, null, 'card formula');
    el('div', 'say', c, tx(say));
    if (src) { const k = el('div', 'code', c); k.innerHTML = code(src); }
    return c;
  }
  /** 상태 테두리를 단다. state: 'hi'(노랑) | 'ok'(초록) | 'bad'(빨강) | 'acc'(대표색) */
  function ring(target) { let r = target.querySelector(':scope > .ring'); if (!r) { r = el('div', 'ring', target); if (getComputedStyle(target).position === 'static') target.style.position = 'relative'; } return r; }
  const STATE = { hi: 'var(--c-yellow)', ok: 'var(--c-green)', bad: 'var(--c-red)', acc: 'var(--accent)' };

  /* ---------- 장면과 스텝 ---------- */
  /**
   * deck.scene(id, {eyebrow, title, sub, nav: {items, on}}, (s, k) => { ... })
   *  s: 장면 요소. 처음부터 보일 요소는 그냥 만들고, 스텝에서 나타날 요소는 k.hide() 로 숨겨 둔다.
   *  k.step(caption, () => { k.appear(...); k.count(...); ... }) 로 스텝을 쌓는다. 시각(at)은 스텝 시작부터 초.
   */
  function scene(id, head, build) {
    const s = el('div', 'scene', stage); s.id = id;
    const sc = { id, head, el: s, start: T, steps: [] };
    scenes.push(sc);
    // 머리: 섹션(eyebrow) + 주장 문장 제목 + 보조 줄
    const hd = [];
    if (head.eyebrow) hd.push(box(s, 110, 64, 1500, null, 'eyebrow', head.eyebrow));
    if (head.title) hd.push(box(s, 110, 96, 1640, null, 't-title', head.title));
    if (head.sub) hd.push(box(s, 110, 160, 1640, null, 't-meta', head.sub));
    const intro = gsap.timeline();
    intro.fromTo(s, { autoAlpha: 0 }, { autoAlpha: 1, duration: .45, ease: 'power1.out' }, 0);
    if (hd.length) intro.from(hd, { autoAlpha: 0, y: 14, duration: .5, stagger: .08, ease: 'power2.out' }, .1);
    let cur = null;
    const k = {
      L, grid, el, box, svg, sv, code, codeBox, formula, tx,
      hide(els) { gsap.set(arr(els), { autoAlpha: 0 }); },
      step(caption, fn) {
        cur = gsap.timeline(); cur.caption = caption; fn && fn(); sc.steps.push(cur); cur = null;
      },
      /** 나타나기: 아래에서 14px 올라오며. stagger 로 차례로 */
      appear(els, at = 0, o = {}) { need(); const a = arr(els); gsap.set(a, { autoAlpha: 0 }); cur.fromTo(a, { autoAlpha: 0, y: o.y ?? 14, scale: o.scale ?? 1 }, { autoAlpha: 1, y: 0, scale: 1, duration: o.d ?? .45, stagger: o.stagger ?? 0, ease: 'power2.out' }, at); },
      fade(els, at = 0, d = .3) { need(); cur.to(arr(els), { autoAlpha: 0, duration: d, ease: 'power1.in' }, at); },
      dim(els, at = 0, to = .25) { need(); cur.to(arr(els), { opacity: to, duration: .35 }, at); },
      /** 위치·크기·색 등 임의 속성 변화 */
      to(els, vars, at = 0) { need(); cur.to(arr(els), Object.assign({ duration: .5, ease: 'power2.inOut' }, vars), at); },
      /** 숫자 세기 */
      count(node, from, to, at = 0, d = .8, fmt = v => Math.round(v).toLocaleString('en-US')) { need(); const o = { v: from }; node.textContent = fmt(from); cur.to(o, { v: to, duration: d, ease: 'power1.inOut', onUpdate: () => node.textContent = fmt(o.v) }, at); },
      /** 타자: 한 글자씩. 코드면 끝난 뒤 강조색을 입힌다 */
      type(node, text, at = 0, d = 1.2, isCode = false) { need(); const o = { n: 0 }; node.textContent = ''; cur.to(o, { n: text.length, duration: d, ease: 'none', onUpdate: () => { const t = text.slice(0, Math.round(o.n)); if (isCode && o.n >= text.length) node.innerHTML = code(t); else node.textContent = t; } }, at); },
      /** 선 그리기: SVG path/line/polyline 을 따라 그린다 */
      draw(paths, at = 0, d = .8) { need(); arr(paths).forEach(p => { const len = p.getTotalLength(); gsap.set(p, { strokeDasharray: len, strokeDashoffset: len }); cur.set(p, { autoAlpha: 1 }, at); cur.to(p, { strokeDashoffset: 0, duration: d, ease: 'power1.inOut' }, at); }); },
      /** 상태 테두리: 강조(hi)·채택(ok)·실패(bad) */
      mark(target, state = 'hi', at = 0) { need(); const r = ring(target); cur.to(r, { borderColor: STATE[state], duration: .25 }, at); },
      unmark(target, at = 0) { need(); cur.to(ring(target), { borderColor: 'transparent', duration: .25 }, at); },
      /** 깜빡임: 바뀐 곳을 짚는다 */
      flash(target, at = 0) { need(); cur.fromTo(target, { filter: 'brightness(2.2)' }, { filter: 'brightness(1)', duration: .6, ease: 'power2.out' }, at); },
      /** 접기: 여러 요소가 대상 자리로 모여 사라지고 대상이 나타난다 */
      fold(els, target, at = 0, d = .6) {
        need();
        const tx0 = parseFloat(target.style.left) + target.offsetWidth / 2, ty0 = parseFloat(target.style.top) + target.offsetHeight / 2;
        arr(els).forEach(e => { const ex = parseFloat(e.style.left) + e.offsetWidth / 2, ey = parseFloat(e.style.top) + e.offsetHeight / 2; cur.to(e, { x: tx0 - ex, y: ty0 - ey, scale: .3, autoAlpha: 0, duration: d, ease: 'power2.in' }, at); });
        gsap.set(target, { autoAlpha: 0 }); cur.fromTo(target, { autoAlpha: 0, scale: .6 }, { autoAlpha: 1, scale: 1, duration: .45, ease: 'back.out(1.6)' }, at + d - .1);
      },
      /** 쉬는 시간: 스텝 끝에 여유를 둔다 */
      hold(sec) { need(); cur.to({}, { duration: sec }, '>'); },
      /** 장면이 보이는 동안 계속 도는 배경 움직임(예: 차량 흐름). fn(tl) 안에서 반복 타임라인을 만든다 */
      ambient(fn) { const a = gsap.timeline({ repeat: -1, paused: true }); fn(a); ambients.push({ sc, a }); },
    };
    function need() { if (!cur) throw new Error(`장면 ${id}: 움직임은 k.step(...) 안에서 만든다`); }
    build(s, k);

    // 타임라인 조립: 장면 등장 → 스텝들 차례로. 스텝 끝마다 멈춤(beat)
    tl.add(intro, T);
    let t = T + .5;
    if (!sc.steps.length) sc.steps.push(Object.assign(gsap.timeline(), { caption: null }));
    sc.steps.forEach((st, i) => {
      const len = Math.max(st.duration(), .6);
      tl.add(st, t);
      if (st.caption) {
        const c = el('div', 'cap', capsEl, tx(st.caption));
        tl.to(c, { autoAlpha: 1, duration: .3 }, t);
        tl.to(c, { autoAlpha: 0, duration: .25 }, t + len + (i === sc.steps.length - 1 ? .45 : .05));
      }
      t += len;
      beats.push({ t, scene: scenes.length - 1, step: i });
    });
    sc.end = t;
    tl.to(s, { autoAlpha: 0, duration: .4 }, t + .5);
    T = t + .5;
    return sc;
  }
  const arr = v => (Array.isArray(v) || v instanceof NodeList) ? [...v] : [v];

  /* ---------- 재생 ---------- */
  let bi = -1, stopAt = null, playAll = false;
  const sceneOf = t => { let k = 0; scenes.forEach((s, i) => { if (t >= s.start - 1e-6) k = i; }); return k; };
  function ui() {
    const t = tl.time(), k = sceneOf(t), sc = scenes[k];
    const mine = beats.filter(b => b.scene === k), done = mine.filter(b => t >= b.t - .05).length;
    dotsEl.innerHTML = mine.map((b, i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('');
    const nav = sc.head.nav;
    if (nav) { navEl.style.visibility = 'visible'; navEl.innerHTML = nav.items.map((it, i) => `<span class="${i === nav.on ? 'on' : i < nav.on ? 'done' : ''}">${tx(it)}</span>`).join(''); }
    else navEl.style.visibility = 'hidden';
    ambients.forEach(o => { const on = o.sc === sc; if (on && o.a.paused()) o.a.play(); else if (!on && !o.a.paused()) o.a.pause(0); });
  }
  tl.eventCallback('onUpdate', () => { if (stopAt !== null && !playAll && tl.time() >= stopAt - 1e-4) { const s = stopAt; stopAt = null; tl.pause(s); } ui(); });
  function seek(t) { tl.pause(); tl.seek(Math.max(0, Math.min(tl.duration(), t)), false); ui(); }
  function beatIndexAt(t) { let i = -1; beats.forEach((b, j) => { if (t >= b.t - .05) i = j; }); return i; }
  function next() {
    playAll = false;
    if (!tl.paused() && stopAt !== null) { const s = stopAt; stopAt = null; seek(s); return; }
    const i = beatIndexAt(tl.time()) + 1; if (i >= beats.length) return;
    stopAt = beats[i].t;
    if (beats[i].scene !== sceneOf(tl.time()) && i > 0) seek(scenes[beats[i].scene].start);
    tl.play();
  }
  function prev() { playAll = false; stopAt = null; const i = beatIndexAt(tl.time() - .06); seek(i <= 0 ? 0 : beats[i - 1].t); }
  function goScene(k) { playAll = false; stopAt = null; seek(scenes[k].start); next(); }
  function toggleAll() { stopAt = null; playAll = !playAll; if (playAll) tl.play(); else tl.pause(); }

  /* ---------- 장면 목록, 언어, 테마, 크기 맞춤 ---------- */
  function buildList() {
    const b = listEl.querySelector('.box');
    b.innerHTML = '';
    scenes.forEach((sc, i) => { const btn = el('button', '', b, `<span class="n">${String(i + 1).padStart(2, '0')} · ${sc.id}</span>${tx(sc.head.title || sc.head.eyebrow || sc.id)}`); btn.onclick = e => { e.stopPropagation(); listEl.hidden = true; goScene(i); }; });
  }
  function toggleList() { listEl.hidden = !listEl.hidden; if (!listEl.hidden) [...listEl.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('cur', i === sceneOf(tl.time()))); }
  listEl.addEventListener('click', () => listEl.hidden = true);
  const store = (k, v) => { try { localStorage.setItem(cfg.key + k, v); } catch (e) {} };
  const load = k => { try { return localStorage.getItem(cfg.key + k); } catch (e) { return null; } };
  function setLang(l) { app.dataset.lang = l; document.documentElement.lang = l; store(':lang', l); }
  function setTheme(t) { document.documentElement.dataset.theme = t; store(':theme', t); }
  const wrap = document.getElementById('wrap');
  function fit() { const w = wrap.clientWidth, h = wrap.clientHeight, s = Math.min(w / 1920, h / 1080); stage.style.transform = `translate(${(w - 1920 * s) / 2}px, ${(h - 1080 * s) / 2}px) scale(${s})`; }
  new ResizeObserver(fit).observe(wrap);
  let idleT; const wake = () => { app.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => app.classList.add('idle'), 2500); };
  ['mousemove', 'pointerdown', 'keydown'].forEach(e => document.addEventListener(e, wake));

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (!listEl.hidden && !'gG'.includes(k) && k !== 'Escape') return;
    if ([' ', 'Enter', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'g' || k === 'G') toggleList();
    else if (k === 'k' || k === 'K') toggleAll();
    else if ((k === 'l' || k === 'L') && cfg.langs.length > 1) setLang(app.dataset.lang === cfg.langs[0] ? cfg.langs[1] : cfg.langs[0]);
    else if (k === 't' || k === 'T') setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    else if (k === 'f' || k === 'F') { if (!document.fullscreenElement) app.requestFullscreen?.(); else document.exitFullscreen(); }
    else if (k === 'Escape') listEl.hidden = true;
    else if (k === 'Home') seek(0);
    else if (k === 'End') seek(beats[beats.length - 1].t);
  });
  stage.addEventListener('click', e => { if (e.target.closest('button, a, input')) return; next(); });

  /** 모든 장면을 만든 뒤 한 번 부른다 */
  function start() {
    fit(); buildList(); wake();
    const keys = 'Space · → 다음   ← 이전   G 장면 목록   K 연속 재생   T 테마' + (cfg.langs.length > 1 ? '   L 언어' : '') + '   F 전체 화면';
    hintEl.textContent = keys; setTimeout(() => hintEl.classList.add('gone'), 5000);
    setLang(load(':lang') && cfg.langs.includes(load(':lang')) ? load(':lang') : cfg.langs[0]);
    const th = load(':theme'); if (th) setTheme(th);
    const h = location.hash.slice(1), k = scenes.findIndex(s => s.id === h);
    seek(k >= 0 ? scenes[k].start : 0);
    next();
    // 검사 스크립트가 쓰는 창구
    window.__deck = { beats: beats.map(b => ({ scene: scenes[b.scene].id, step: b.step, t: b.t })), seekBeat: i => seek(beats[i].t), setTheme, setLang };
  }
  return { config: o => Object.assign(cfg, o), scene, start, L, grid, tx, code };
})();
</script>

<script>
/* ======================= 장면 (이 부분만 자료에 맞게 바꾼다) =======================
   예시 주제: 배송 경로 탐색. 무대(왼쪽)에는 늘 같은 배송 지도, 작업대(오른쪽)에는 그 장면의 설명. */
deck.config({ langs: ['ko', 'en'] });   // 한 언어만 쓰면 ['ko'] 로 두고 글을 문자열로 쓴다

// 늘 같은 자리의 기준 예제: 차고지 하나와 배송지 여섯 곳
const STOPS = [[120, 120], [470, 90], [520, 330], [300, 420], [90, 560], [430, 600]], DEPOT = [300, 260];
function deliveryMap(s, k) {
  const g = k.svg(s, k.L.stage.x, k.L.stage.y, 640, 700);
  for (let i = 0; i <= 6; i++) { k.sv('line', { x1: 0, y1: i * 110 + 20, x2: 620, y2: i * 110 + 20, style: 'stroke:var(--card2);stroke-width:14' }, g); k.sv('line', { x1: i * 100 + 10, y1: 0, x2: i * 100 + 10, y2: 690, style: 'stroke:var(--card2);stroke-width:14' }, g); }
  const route = k.sv('polyline', { points: [DEPOT, ...STOPS, DEPOT].map(p => p.join(',')).join(' '), style: 'fill:none;stroke:var(--accent);stroke-width:6;stroke-linejoin:round' }, g);
  k.sv('rect', { x: DEPOT[0] - 22, y: DEPOT[1] - 22, width: 44, height: 44, rx: 8, style: 'fill:var(--c-orange)' }, g);
  const dots = STOPS.map(([x, y], i) => { k.sv('circle', { cx: x, cy: y, r: 18, style: 'fill:var(--card3)' }, g); return k.sv('text', { x, y: y + 7, 'text-anchor': 'middle', style: 'font:700 20px var(--font);fill:var(--fg)' }, g, String(i + 1)); });
  return { g, route, dots };
}

deck.scene('title', {}, (s, k) => {
  k.box(s, 0, 360, 1920, null, '', `<div style="text-align:center;font:800 120px/1 var(--font);letter-spacing:-.04em">배송 경로 <span style="color:var(--accent)">탐색</span></div>`);
  k.box(s, 0, 530, 1920, null, '', `<div style="text-align:center;font:400 34px/1.4 var(--font);color:var(--fg2)">${k.tx(['짧은 프로그램으로 배송 순서를 정한다', 'Choosing delivery order with a short program'])}</div>`);
  k.box(s, 0, 640, 1920, null, '', `<div style="text-align:center;font:500 24px var(--mono);color:var(--fg3)">route = argmin(orders(), cost)</div>`);
});

deck.scene('cost', { eyebrow: ['경로 비용', 'Route cost'], title: ['경로 비용은 이동 거리와 늦은 배송의 벌점을 더한 값이다', 'Route cost adds travel distance and a lateness penalty'], nav: { items: [['비용', 'Cost'], ['탐색', 'Search'], ['결과', 'Result']], on: 0 } }, (s, k) => {
  const m = deliveryMap(s, k); k.hide(m.route);
  const f = k.formula(s, k.L.bench.x, k.L.bench.y, k.L.bench.w, ['경로 비용 = 이동 거리 + 10 × 늦은 배송 수', 'cost = distance + 10 × late stops'], 'cost(r) = sum(dist(a, b) for a, b in legs(r)) + 10 * late(r)');
  const val = k.box(s, k.L.bench.x, k.L.bench.y + 220, 600, null, '', `<div class="t-meta">${k.tx(['이 순서의 비용', 'Cost of this order'])}</div><div class="t-big">0</div>`);
  const num = val.querySelector('.t-big');
  k.hide([f, val]);
  k.step(['차고지에서 출발해 배송지 여섯 곳을 돌고 돌아온다.', 'The van leaves the depot, visits six stops and returns.'], () => { k.draw(m.route, .2, 1.4); });
  k.step(['이 순서의 이동 거리는 18.4 km이고 늦은 배송이 한 곳이라, 비용은 28.4다.', 'This order covers 18.4 km with one late stop, so its cost is 28.4.'], () => { k.appear(f); k.appear(val, .3); k.count(num, 0, 28.4, .4, .9, v => v.toFixed(1)); });
});

deck.scene('result', { eyebrow: ['결과', 'Result'], title: ['탐색한 순서는 사람이 정한 순서보다 비용이 22% 낮다', 'The searched order costs 22% less than the hand-made one'], nav: { items: [['비용', 'Cost'], ['탐색', 'Search'], ['결과', 'Result']], on: 2 } }, (s, k) => {
  const rows = [['탐색한 순서', 'Searched', 22.1, true], ['가까운 곳부터', 'Nearest first', 26.7], ['사람이 정한 순서', 'Hand-made', 28.4]];
  const X = v => 360 + v / 40 * 1100;
  const c = k.box(s, 110, 240, 1700, 600, 'card');
  const g = k.svg(c, 0, 0, 1700, 600);
  const bars = rows.map(([ko, en, v, me], i) => {
    const y = 90 + i * 130;
    k.sv('text', { x: 320, y: y + 40, 'text-anchor': 'end', style: `font:${me ? 700 : 500} 26px var(--font);fill:${me ? 'var(--accent)' : 'var(--fg2)'}` }, g, [ko, en]);
    const r = k.sv('rect', { x: 360, y, width: X(v) - 360, height: 56, rx: 8, style: `fill:${me ? 'var(--accent)' : 'var(--card3)'}` }, g);
    k.sv('text', { x: X(v) + 14, y: y + 40, style: 'font:700 26px var(--font);fill:var(--fg)' }, g, v.toFixed(1));
    return r;
  });
  const ref = k.sv('line', { x1: X(25), x2: X(25), y1: 60, y2: 480, style: 'stroke:var(--fg3);stroke-width:2;stroke-dasharray:8 6' }, g);
  const refT = k.sv('text', { x: X(25) + 10, y: 530, style: 'font:500 21px var(--font);fill:var(--fg2)' }, g, ['목표 25.0', 'Target 25.0']);
  k.hide([...bars, ref, refT]);
  k.step(['같은 배송지 여섯 곳에서 세 순서의 비용을 비교한다.', 'Three orders are compared on the same six stops.'], () => { k.appear(bars, 0, { stagger: .12, y: 0 }); });
  k.step(['탐색한 순서만 목표 25.0보다 낮다.', 'Only the searched order is below the 25.0 target.'], () => { k.appear([ref, refT]); });
});

deck.start();
</script>
