<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>banner</title>
<!-- README 배너 원본. tools/readme/README.md 의 방법으로 docs/banner-light.png, docs/banner-dark.png 를 찍는다. 주소 끝 ?dark 면 다크. -->
<style>
@font-face { font-family: "Pretendard"; src: url("../../skills/html-report-master/assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; }
:root { --bg: #f5f5f7; --fg: #1d1d1f; --fg2: #48484a; --chip: #fff; --accent: #6a3d9a; --shadow: 0 2px 6px rgb(0 0 0 / .06), 0 30px 70px rgb(0 0 0 / .14); }
:root.dark { --bg: #000; --fg: #f5f5f7; --fg2: #c7c7cc; --chip: #1c1c1e; --accent: #b48ce0; --shadow: 0 30px 70px rgb(0 0 0 / .6); }
html, body { margin: 0; }
body { width: 2560px; height: 1040px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Pretendard", sans-serif; letter-spacing: -.02em; position: relative; }
.left { position: absolute; left: 128px; top: 150px; width: 1180px; }
.eyebrow { font-size: 34px; font-weight: 600; color: var(--fg2); }
h1 { margin: 22px 0 26px; font-size: 128px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
h1 span { color: var(--accent); }
p { margin: 0; font-size: 46px; line-height: 1.45; color: var(--fg2); word-break: keep-all; }
.chips { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 52px; }
.chips b { display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px; border-radius: 99px; background: var(--chip); box-shadow: 0 1px 3px rgb(0 0 0 / .08); font-size: 32px; font-weight: 700; }
.chips i { font-style: normal; color: var(--accent); }
.shot { position: absolute; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); }
.shot img { display: block; width: 100%; }
.report { left: 1330px; top: 90px; width: 1000px; transform: rotate(-2.2deg); background: #fff; }
.deck { left: 1440px; top: 470px; width: 1060px; transform: rotate(1.6deg); }
</style>
</head>
<body>
<div class="left">
  <div class="eyebrow">Claude Code · Codex · Cursor용 에이전트 스킬</div>
  <h1>html-report-<span>master</span></h1>
  <p>논문이나 프로젝트를 남에게 설명할 수 있게 풀어 주는 한국어 HTML 보고서와 모션 발표.</p>
  <div class="chips"><b><i>①</i>예 하나로 끝까지</b><b><i>②</i>숫자로 직접 계산</b><b><i>③</i>만져 보는 모형</b><b><i>④</i>스텝마다 멈추는 발표</b><b><i>⑤</i>한 파일 HTML</b></div>
</div>
<div class="shot report"><img src="../../docs/report-softmax.png" alt=""></div>
<div class="shot deck"><img id="deck" src="../../docs/tf-softmax-dark.png" alt=""></div>
<script>
if (location.search.includes('dark')) { document.documentElement.classList.add('dark'); document.getElementById('deck').src = '../../docs/tf-softmax-dark.png'; }
else document.getElementById('deck').src = '../../docs/tf-softmax-light.png';
</script>
</body>
</html>
